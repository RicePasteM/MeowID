__include__: [
  '../dataset/cat_face_pose.yml',
  'ecpose.yml'
]

output_dir: outputs/ecpose_x_cat_face_mixed

# ECPose-X backbone 配置
ViTAdapter:
  name: ecpose_vitsplus
  embed_dim: 384
  num_heads: 6
  proj_dim: 256
  interaction_indexes: [10, 11]
  ffn_ratio: 6
  weights_path: ecvits/ecpose_vitsplus.pth

HybridEncoder:
  in_channels: [256, 256, 256]
  hidden_dim: 256
  depth_mult: 1
  expansion: 1.5
  dim_feedforward: 2048

DETRTransformer:
  hidden_dim: 256
  dim_feedforward: 2048
  num_decoder_layers: 4
  num_body_points: 9

DETRPoseCriterion:
  num_classes: 2
  weight_dict: {loss_vfl: 2.0, loss_keypoints: 10.0, loss_oks: 4.0}
  focal_alpha: 0.25
  losses: [vfl, keypoints]
  matcher:
    type: DETRPoseHungarianMatcher
    cost_class: 2.0
    cost_keypoints: 10.0
    cost_oks: 4.0
    focal_alpha: 0.25
    num_body_points: 9
  num_body_points: 9

DETRPosePostProcessor:
  num_select: 60
  num_body_points: 9

eval_spatial_size: [640, 640] # h w

# 训练参数
epoches: 100
grad_accum_steps: 1
print_freq: 20

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*.backbone)(?!.*(?:norm|bn|bias)).*$'
      lr: 2.5e-06
    -
      params: '^(?=.*.backbone)(?=.*(?:norm|bn|bias)).*$'
      lr: 2.5e-06
      weight_decay: 0.
    -
      params: '^(?!.*\.backbone)(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.000125


train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: RandomHorizontalFlip}
        - {type: ColorJitter}
        - {type: Resize, size: [640, 640]}
        - {type: ToTensor}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
      policy: {name: default}
  total_batch_size: 32
  collate_fn:
    stop_epoch: 72

# The generic ECPose base config evaluates 64 images per GPU. That is too
# large for 640x640 ECPose-X validation and also overrides the dataset default.
val_dataloader:
  total_batch_size: 8


use_amp: True
find_unused_parameters: False

clip_max_norm: 0.1
lr_warmup_scheduler:
  warmup_duration: 125

# The original milestones were expressed in optimizer steps for global batch
# 8. Scale them by 1/4 so the LR changes after the same number of samples.
lr_scheduler:
  milestones: [1250]
  gamma: 0.5
